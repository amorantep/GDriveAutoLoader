<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDrive AutoLoader</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #242840;
    --border: #2e3250;
    --accent: #5865f2;
    --accent-hover: #4752c4;
    --green: #3ba55c;
    --red: #ed4245;
    --yellow: #faa61a;
    --text: #e3e5e8;
    --text-muted: #8e9297;
    --radius: 8px;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .auth-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.ok { background: var(--green); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .step-num { background: var(--accent); color: white; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type=text], input[type=number] { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 8px 12px; font-size: 14px; outline: none; }
  input[type=text] { flex: 1; min-width: 200px; }
  input[type=text]:focus, input[type=number]:focus { border-color: var(--accent); }
  button { background: var(--accent); color: white; border: none; border-radius: var(--radius); padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: var(--surface2); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--border); }
  button.danger { background: var(--red); }
  button.success { background: var(--green); }
  .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--surface2); font-weight: 600; font-size: 13px; cursor: pointer; user-select: none; }
  th:hover { background: var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .sort-arrow { margin-left: 4px; color: var(--accent); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-ok { background: rgba(59,165,92,0.2); color: var(--green); }
  .badge-failed { background: rgba(237,66,69,0.2); color: var(--red); }
  .badge-skipped { background: rgba(250,166,26,0.2); color: var(--yellow); }
  .badge-running { background: rgba(88,101,242,0.2); color: var(--accent); }
  .progress-wrap { background: var(--surface2); border-radius: 99px; height: 12px; overflow: hidden; margin: 8px 0; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }
  .progress-bar.done { background: var(--green); }
  .progress-label { font-size: 13px; color: var(--text-muted); }
  .current-file { font-size: 13px; margin-top: 8px; color: var(--text-muted); }
  .current-file strong { color: var(--text); }
  .folder-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); margin-top: 10px; }
  .folder-item { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); transition: background 0.1s; }
  .folder-item:last-child { border-bottom: none; }
  .folder-item:hover { background: var(--border); }
  .folder-item.selected { background: rgba(88,101,242,0.15); border-left: 3px solid var(--accent); }
  .folder-icon { font-size: 16px; }
  .folder-breadcrumb { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; margin-bottom: 8px; }
  .breadcrumb-item { cursor: pointer; color: var(--accent); }
  .breadcrumb-item:hover { text-decoration: underline; }
  .slider-wrap { display: flex; align-items: center; gap: 12px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .slider-val { font-weight: 600; min-width: 55px; }
  .hidden { display: none !important; }
  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
  .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; flex: 1; min-width: 100px; }
  .stat-box .val { font-size: 22px; font-weight: 700; }
  .stat-box .lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .export-row { display: flex; gap: 10px; margin-top: 16px; }
  #selectAll { cursor: pointer; }
  .md5-cell { font-family: monospace; font-size: 11px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .error-text { color: var(--red); font-size: 12px; }
  .info-banner { background: rgba(88,101,242,0.1); border: 1px solid rgba(88,101,242,0.3); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; color: var(--accent); margin-bottom: 12px; }
</style>
</head>
<body>
<header>
  <h1>&#9729; GDrive AutoLoader</h1>
  <div class="auth-badge">
    <span class="dot" id="authDot"></span>
    <span id="authLabel">Checking...</span>
    <button id="loginBtn" class="secondary" style="padding:5px 12px;font-size:13px;">Login with Google</button>
  </div>
</header>
<main>
  <!-- Step 1: File Picker -->
  <div class="card" id="step1">
    <div class="card-title"><span class="step-num">1</span> Select Local Folder</div>
    <div class="row">
      <input type="text" id="folderPath" placeholder="Enter folder path, e.g. /home/user/photos">
      <button id="loadFilesBtn">Load Files</button>
    </div>
    <div id="fileTableWrap" class="hidden">
      <div class="row" style="margin-top:14px;justify-content:space-between;">
        <span id="fileCount" class="progress-label"></span>
        <div class="row" style="gap:6px;">
          <span style="font-size:13px;color:var(--text-muted)">Sort:</span>
          <button class="secondary" id="sortNameBtn" style="padding:4px 10px;font-size:12px;">Name</button>
          <button class="secondary" id="sortSizeBtn" style="padding:4px 10px;font-size:12px;">Size</button>
          <button class="secondary" id="sortTypeBtn" style="padding:4px 10px;font-size:12px;">Type</button>
          <button class="secondary" id="sortCreatedBtn" style="padding:4px 10px;font-size:12px;">Created</button>
          <button class="secondary" id="sortModifiedBtn" style="padding:4px 10px;font-size:12px;">Modified</button>
        </div>
      </div>
      <div class="table-wrap" style="margin-top:10px;">
        <table>
          <thead>
            <tr>
              <th style="width:36px;"><input type="checkbox" id="selectAll"></th>
              <th data-col="name">Name <span class="sort-arrow" id="sa-name"></span></th>
              <th data-col="size">Size <span class="sort-arrow" id="sa-size"></span></th>
              <th data-col="type">Type <span class="sort-arrow" id="sa-type"></span></th>
              <th data-col="created">Created <span class="sort-arrow" id="sa-created"></span></th>
              <th data-col="modified">Modified <span class="sort-arrow" id="sa-modified"></span></th>
            </tr>
          </thead>
          <tbody id="fileTableBody"></tbody>
        </table>
      </div>
      <div style="margin-top:10px;display:flex;justify-content:flex-end;">
        <button id="proceedStep2Btn">Choose Drive Folder &#8594;</button>
      </div>
    </div>
  </div>

  <!-- Step 2: Drive Folder Picker -->
  <div class="card hidden" id="step2">
    <div class="card-title"><span class="step-num">2</span> Select Google Drive Destination</div>
    <button id="loadFoldersBtn">Load Drive Folders</button>
    <div id="folderBreadcrumb" class="folder-breadcrumb hidden"></div>
    <div id="driveFolderList" class="folder-list hidden"></div>
    <div id="selectedFolderInfo" class="hidden" style="margin-top:10px;font-size:13px;">
      Selected: <strong id="selectedFolderName" style="color:var(--accent)"></strong>
    </div>
    <div style="margin-top:12px;display:flex;justify-content:flex-end;">
      <button id="proceedStep3Btn" class="hidden">Configure Upload &#8594;</button>
    </div>
  </div>

  <!-- Step 3: Upload Config -->
  <div class="card hidden" id="step3">
    <div class="card-title"><span class="step-num">3</span> Upload Configuration</div>
    <div style="margin-bottom:16px;">
      <label style="font-size:13px;color:var(--text-muted);display:block;margin-bottom:8px;">Delay between uploads</label>
      <div class="slider-wrap">
        <span style="font-size:12px;color:var(--text-muted)">100ms</span>
        <input type="range" id="delaySlider" min="100" max="2000" step="100" value="500">
        <span style="font-size:12px;color:var(--text-muted)">2000ms</span>
        <span class="slider-val" id="delayVal">500ms</span>
      </div>
    </div>
    <div id="uploadSummary" class="info-banner"></div>
    <button id="startUploadBtn" class="success" style="margin-top:8px;">&#128640; Start Upload</button>
  </div>

  <!-- Step 4: Progress -->
  <div class="card hidden" id="step4">
    <div class="card-title"><span class="step-num">4</span> Uploading...</div>
    <div class="row" style="justify-content:space-between;margin-bottom:6px;">
      <span class="progress-label" id="progressLabel">0 / 0</span>
      <span class="progress-label" id="progressPct">0%</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
    <div class="current-file" id="currentFileInfo"></div>
  </div>

  <!-- Step 5: Report -->
  <div class="card hidden" id="step5">
    <div class="card-title"><span class="step-num">5</span> Upload Report</div>
    <div class="stats-row" id="statsRow"></div>
    <div class="export-row">
      <button id="exportCsvBtn" class="secondary">&#128190; Export CSV</button>
      <button id="exportJsonBtn" class="secondary">&#123;&#125; Export JSON</button>
    </div>
    <div class="table-wrap" style="margin-top:16px;">
      <table>
        <thead>
          <tr>
            <th>Filename</th>
            <th>Size</th>
            <th>Local MD5</th>
            <th>Drive MD5</th>
            <th>Status</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody id="reportTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const API = '';
let allFiles = [];
let sortBy = 'name';
let sortDir = 'asc';
let selectedFiles = new Set();
let selectedFolderId = 'root';
let selectedFolderName = 'My Drive';
let currentJobId = null;
let folderStack = [{ id: 'root', name: 'My Drive' }];

// --- Utilities ---
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

function truncMd5(md5) {
  if (!md5) return '—';
  return md5.slice(0, 8) + '…';
}

function statusEmoji(status) {
  if (status === 'ok') return '✅ OK';
  if (status === 'failed') return '❌ FAILED';
  if (status === 'skipped') return '⏭ SKIPPED';
  return status;
}

// --- Auth ---
async function checkAuth() {
  try {
    const r = await fetch(API + '/auth/status');
    const d = await r.json();
    const dot = document.getElementById('authDot');
    const label = document.getElementById('authLabel');
    const btn = document.getElementById('loginBtn');
    if (d.authenticated) {
      dot.classList.add('ok');
      label.textContent = 'Authenticated';
      btn.style.display = 'none';
    } else {
      dot.classList.remove('ok');
      label.textContent = 'Not authenticated';
      btn.style.display = '';
    }
  } catch(e) {
    console.error('Auth check failed', e);
  }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const r = await fetch(API + '/auth/login');
  const d = await r.json();
  if (d.auth_url) {
    const win = window.open(d.auth_url, '_blank', 'width=500,height=600');
    window.addEventListener('message', async (e) => {
      if (e.data === 'auth_complete') {
        await checkAuth();
      }
    }, { once: true });
  }
});

// --- File Loading ---
let sortState = { col: 'name', dir: 'asc' };

async function loadFiles() {
  const path = document.getElementById('folderPath').value.trim();
  if (!path) return alert('Please enter a folder path.');
  const r = await fetch(API + '/files/list', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, sort_by: sortState.col, sort_dir: sortState.dir })
  });
  if (!r.ok) {
    const e = await r.json();
    return alert('Error: ' + (e.detail || 'Failed to load files'));
  }
  const d = await r.json();
  allFiles = d.files;
  selectedFiles = new Set(allFiles.map((_, i) => i));
  renderFileTable();
  document.getElementById('fileTableWrap').classList.remove('hidden');
  document.getElementById('fileCount').textContent = allFiles.length + ' files found';
}

function renderFileTable() {
  const tbody = document.getElementById('fileTableBody');
  if (allFiles.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No files found in this folder.</td></tr>';
    return;
  }
  tbody.innerHTML = allFiles.map((f, i) => `
    <tr>
      <td><input type="checkbox" class="file-cb" data-idx="${i}" ${selectedFiles.has(i) ? 'checked' : ''}></td>
      <td title="${f.name}">${f.name}</td>
      <td>${fmtSize(f.size)}</td>
      <td>${f.extension || '—'}</td>
      <td>${fmtDate(f.created)}</td>
      <td>${fmtDate(f.modified)}</td>
    </tr>
  `).join('');
  document.querySelectorAll('.file-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      const idx = parseInt(cb.dataset.idx);
      if (cb.checked) selectedFiles.add(idx);
      else selectedFiles.delete(idx);
    });
  });
  updateSortArrows();
}

function updateSortArrows() {
  ['name','size','type','created','modified'].forEach(col => {
    const el = document.getElementById('sa-' + col);
    if (!el) return;
    if (sortState.col === col) {
      el.textContent = sortState.dir === 'asc' ? '▲' : '▼';
    } else {
      el.textContent = '';
    }
  });
}

async function sortAndReload(col) {
  if (sortState.col === col) {
    sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
  } else {
    sortState.col = col;
    sortState.dir = 'asc';
  }
  const path = document.getElementById('folderPath').value.trim();
  if (!path) return;
  const r = await fetch(API + '/files/list', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, sort_by: sortState.col, sort_dir: sortState.dir })
  });
  if (!r.ok) return;
  const d = await r.json();
  allFiles = d.files;
  renderFileTable();
}

document.getElementById('loadFilesBtn').addEventListener('click', loadFiles);
document.getElementById('folderPath').addEventListener('keydown', e => { if (e.key === 'Enter') loadFiles(); });

document.getElementById('selectAll').addEventListener('change', (e) => {
  if (e.target.checked) {
    selectedFiles = new Set(allFiles.map((_, i) => i));
  } else {
    selectedFiles.clear();
  }
  renderFileTable();
  document.getElementById('selectAll').checked = e.target.checked;
});

// Column header click sort
document.querySelectorAll('th[data-col]').forEach(th => {
  th.addEventListener('click', () => sortAndReload(th.dataset.col));
});

// Sort buttons
document.getElementById('sortNameBtn').addEventListener('click', () => sortAndReload('name'));
document.getElementById('sortSizeBtn').addEventListener('click', () => sortAndReload('size'));
document.getElementById('sortTypeBtn').addEventListener('click', () => sortAndReload('type'));
document.getElementById('sortCreatedBtn').addEventListener('click', () => sortAndReload('created'));
document.getElementById('sortModifiedBtn').addEventListener('click', () => sortAndReload('modified'));

document.getElementById('proceedStep2Btn').addEventListener('click', () => {
  const checked = allFiles.filter((_, i) => selectedFiles.has(i));
  if (checked.length === 0) return alert('Select at least one file.');
  document.getElementById('step2').classList.remove('hidden');
  document.getElementById('step2').scrollIntoView({ behavior: 'smooth' });
});

// --- Drive Folder Picker ---
async function loadFolders(parentId = 'root') {
  const list = document.getElementById('driveFolderList');
  list.innerHTML = '<div style="padding:14px;color:var(--text-muted)">Loading...</div>';
  list.classList.remove('hidden');
  document.getElementById('folderBreadcrumb').classList.remove('hidden');

  const r = await fetch(API + '/drive/folders?parent_id=' + encodeURIComponent(parentId));
  if (!r.ok) {
    const e = await r.json();
    list.innerHTML = '<div style="padding:14px;color:var(--red)">Error: ' + (e.detail || 'Failed') + '</div>';
    return;
  }
  const d = await r.json();
  const folders = d.folders;

  // Add "Use this folder" option
  const currentFolder = folderStack[folderStack.length - 1];
  let html = `<div class="folder-item" data-id="${currentFolder.id}" data-name="${currentFolder.name}" data-action="select">
    <span class="folder-icon">&#128194;</span>
    <span style="flex:1;font-style:italic;">Use: ${currentFolder.name}</span>
    <span style="color:var(--accent);font-size:12px;">&#10003; Select</span>
  </div>`;

  if (folders.length === 0) {
    html += '<div style="padding:10px 14px;color:var(--text-muted);font-size:13px;">No subfolders here.</div>';
  } else {
    html += folders.map(f => `
      <div class="folder-item" data-id="${f.id}" data-name="${f.name}" data-action="navigate">
        <span class="folder-icon">&#128193;</span>
        <span style="flex:1;">${f.name}</span>
        <span style="color:var(--text-muted);font-size:12px;">&#8594;</span>
      </div>
    `).join('');
  }
  list.innerHTML = html;

  list.querySelectorAll('.folder-item').forEach(item => {
    item.addEventListener('click', () => {
      const id = item.dataset.id;
      const name = item.dataset.name;
      const action = item.dataset.action;
      if (action === 'select') {
        selectedFolderId = id;
        selectedFolderName = name;
        document.getElementById('selectedFolderName').textContent = name;
        document.getElementById('selectedFolderInfo').classList.remove('hidden');
        document.getElementById('proceedStep3Btn').classList.remove('hidden');
        list.querySelectorAll('.folder-item').forEach(x => x.classList.remove('selected'));
        item.classList.add('selected');
      } else {
        folderStack.push({ id, name });
        renderBreadcrumb();
        loadFolders(id);
      }
    });
  });

  renderBreadcrumb();
}

function renderBreadcrumb() {
  const bc = document.getElementById('folderBreadcrumb');
  bc.innerHTML = folderStack.map((f, i) => {
    if (i === folderStack.length - 1) {
      return `<span style="color:var(--text)">${f.name}</span>`;
    }
    return `<span class="breadcrumb-item" data-idx="${i}">${f.name}</span> <span style="color:var(--text-muted)">/</span>`;
  }).join(' ');
  bc.querySelectorAll('.breadcrumb-item').forEach(item => {
    item.addEventListener('click', () => {
      const idx = parseInt(item.dataset.idx);
      folderStack = folderStack.slice(0, idx + 1);
      loadFolders(folderStack[folderStack.length - 1].id);
    });
  });
}

document.getElementById('loadFoldersBtn').addEventListener('click', () => {
  folderStack = [{ id: 'root', name: 'My Drive' }];
  loadFolders('root');
});

document.getElementById('proceedStep3Btn').addEventListener('click', () => {
  const checkedFiles = allFiles.filter((_, i) => selectedFiles.has(i));
  const totalSize = checkedFiles.reduce((s, f) => s + f.size, 0);
  document.getElementById('uploadSummary').textContent =
    `Ready to upload ${checkedFiles.length} file(s) (${fmtSize(totalSize)}) to "${selectedFolderName}"`;
  document.getElementById('step3').classList.remove('hidden');
  document.getElementById('step3').scrollIntoView({ behavior: 'smooth' });
});

// --- Delay Slider ---
const slider = document.getElementById('delaySlider');
const delayVal = document.getElementById('delayVal');
slider.addEventListener('input', () => { delayVal.textContent = slider.value + 'ms'; });

// --- Upload ---
document.getElementById('startUploadBtn').addEventListener('click', async () => {
  const checkedFiles = allFiles.filter((_, i) => selectedFiles.has(i));
  if (checkedFiles.length === 0) return alert('No files selected.');
  if (!selectedFolderId) return alert('No Drive folder selected.');

  const body = {
    files: checkedFiles,
    destination_folder_id: selectedFolderId,
    delay_ms: parseInt(slider.value)
  };

  const r = await fetch(API + '/upload/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const e = await r.json();
    return alert('Error starting upload: ' + (e.detail || 'Unknown'));
  }
  const d = await r.json();
  currentJobId = d.job_id;

  document.getElementById('step4').classList.remove('hidden');
  document.getElementById('step4').scrollIntoView({ behavior: 'smooth' });
  document.getElementById('startUploadBtn').disabled = true;

  startSSE(currentJobId, checkedFiles.length);
});

function startSSE(jobId, total) {
  const es = new EventSource(API + '/upload/progress/' + jobId);
  const bar = document.getElementById('progressBar');
  const label = document.getElementById('progressLabel');
  const pct = document.getElementById('progressPct');
  const info = document.getElementById('currentFileInfo');

  es.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.done) {
      es.close();
      bar.classList.add('done');
      info.innerHTML = '<strong>All done!</strong>';
      showReport(jobId);
      return;
    }
    const idx = data.index + 1;
    const p = Math.round((idx / total) * 100);
    bar.style.width = p + '%';
    label.textContent = idx + ' / ' + total;
    pct.textContent = p + '%';

    let statusBadge = '';
    if (data.status === 'ok') statusBadge = '<span class="badge badge-ok">✅ OK</span>';
    else if (data.status === 'failed') statusBadge = '<span class="badge badge-failed">❌ FAILED</span>';
    else if (data.status === 'skipped') statusBadge = '<span class="badge badge-skipped">⏭ SKIPPED</span>';

    info.innerHTML = `<strong>${data.file}</strong> &nbsp;${statusBadge}`;
  };

  es.onerror = () => { es.close(); };
}

async function showReport(jobId) {
  const r = await fetch(API + '/upload/report/' + jobId);
  if (!r.ok) return;
  const data = await r.json();
  const results = data.results;

  // Stats
  const ok = results.filter(r => r.status === 'ok').length;
  const failed = results.filter(r => r.status === 'failed').length;
  const skipped = results.filter(r => r.status === 'skipped').length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-box"><div class="val" style="color:var(--green)">${ok}</div><div class="lbl">Uploaded OK</div></div>
    <div class="stat-box"><div class="val" style="color:var(--red)">${failed}</div><div class="lbl">Failed</div></div>
    <div class="stat-box"><div class="val" style="color:var(--yellow)">${skipped}</div><div class="lbl">Skipped</div></div>
    <div class="stat-box"><div class="val">${results.length}</div><div class="lbl">Total</div></div>
  `;

  // Table
  const tbody = document.getElementById('reportTableBody');
  tbody.innerHTML = results.map(r => {
    let badge = '';
    if (r.status === 'ok') badge = '<span class="badge badge-ok">✅ OK</span>';
    else if (r.status === 'failed') badge = '<span class="badge badge-failed">❌ FAILED</span>';
    else if (r.status === 'skipped') badge = '<span class="badge badge-skipped">⏭ SKIPPED</span>';
    const md5Match = r.local_md5 && r.drive_md5 && r.local_md5 === r.drive_md5;
    return `<tr>
      <td title="${r.filename}">${r.filename}</td>
      <td>${fmtSize(r.size)}</td>
      <td class="md5-cell" title="${r.local_md5 || ''}">${truncMd5(r.local_md5)}</td>
      <td class="md5-cell" title="${r.drive_md5 || ''}" style="${r.drive_md5 && !md5Match ? 'color:var(--red)' : ''}">${truncMd5(r.drive_md5)}</td>
      <td>${badge}${r.error ? '<div class="error-text">' + r.error + '</div>' : ''}</td>
      <td>${fmtDate(r.timestamp)}</td>
    </tr>`;
  }).join('');

  document.getElementById('step5').classList.remove('hidden');
  document.getElementById('step5').scrollIntoView({ behavior: 'smooth' });
}

// Export
document.getElementById('exportCsvBtn').addEventListener('click', () => {
  if (!currentJobId) return;
  window.location.href = API + '/upload/report/' + currentJobId + '/csv';
});

document.getElementById('exportJsonBtn').addEventListener('click', async () => {
  if (!currentJobId) return;
  const r = await fetch(API + '/upload/report/' + currentJobId);
  const data = await r.json();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'upload_report_' + currentJobId + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

// Init
checkAuth();
