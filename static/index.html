<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDrive AutoLoader</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f0f4f8;
      --surface:   #ffffff;
      --border:    #d1d9e0;
      --primary:   #1a73e8;
      --primary-h: #1558c0;
      --danger:    #d93025;
      --success:   #1e8e3e;
      --warning:   #f29900;
      --muted:     #6b7280;
      --text:      #1f2937;
      --radius:    8px;
      --shadow:    0 1px 4px rgba(0,0,0,.10);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    header h1 { font-size: 1.3rem; font-weight: 600; }

    #auth-badge {
      margin-left: auto;
      font-size: .85rem;
      background: rgba(255,255,255,.15);
      padding: 4px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #auth-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    #auth-badge.ok .dot { background: #81c995; }
    #auth-badge a { color: #fff; text-decoration: underline; cursor: pointer; font-size: .82rem; }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
    }
    .card-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .step-label {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      width: 22px; height: 22px;
      font-size: .72rem;
      font-weight: 700;
      text-align: center;
      line-height: 22px;
      margin-right: 8px;
    }

    .row { display: flex; gap: 8px; align-items: center; }

    input[type="text"] {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: .93rem;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    button {
      border: none;
      border-radius: var(--radius);
      padding: 8px 18px;
      font-size: .9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    button.primary { background: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-h); }
    button.secondary { background: var(--surface); color: var(--primary); border: 1px solid var(--primary); }
    button.secondary:hover { background: #e8f0fe; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .table-wrap { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th {
      background: var(--bg);
      font-weight: 600;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      user-select: none;
    }
    th.sortable { cursor: pointer; }
    th.sortable:hover { background: #dce5f0; }
    th .sort-arrow { margin-left: 4px; color: var(--muted); }
    tr:hover td { background: #f7faff; }
    td.nowrap { white-space: nowrap; }
    .check-col { width: 32px; text-align: center; }

    .sel-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-size: .85rem;
      color: var(--muted);
    }
    .sel-row a { color: var(--primary); cursor: pointer; text-decoration: underline; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: .78rem;
      font-weight: 600;
      background: #e8f0fe;
      color: var(--primary);
      border: 1px solid #b3c9f5;
      margin-left: 6px;
    }

    #folder-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 280px;
      overflow-y: auto;
    }
    .folder-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .folder-item:hover { background: #f0f4ff; }
    .folder-item.selected { background: #e8f0fe; border-color: var(--primary); }
    .folder-icon { font-size: 1.1rem; }
    .folder-name { font-size: .9rem; }

    .slider-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    input[type="range"] { flex: 1; min-width: 180px; accent-color: var(--primary); }
    #delay-val { font-weight: 600; min-width: 60px; }

    #progress-bar-wrap {
      background: var(--border);
      border-radius: 20px;
      height: 10px;
      margin: 10px 0;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 20px;
      transition: width .3s ease;
    }
    #progress-info { font-size: .9rem; color: var(--muted); }
    #current-file { font-weight: 500; color: var(--text); margin-top: 4px; word-break: break-all; }

    .status-chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: .78rem;
      font-weight: 600;
    }
    .chip-uploaded { background: #d4edda; color: var(--success); }
    .chip-skipped  { background: #fff3cd; color: #856404; }
    .chip-error    { background: #f8d7da; color: var(--danger); }

    .export-row { display: flex; gap: 8px; margin-top: 14px; }

    .hidden { display: none !important; }
    .text-muted { color: var(--muted); font-size: .85rem; }
    .mt8  { margin-top: 8px; }
    .mt14 { margin-top: 14px; }
  </style>
</head>
<body>

<header>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
  </svg>
  <h1>GDrive AutoLoader</h1>
  <div id="auth-badge">
    <span class="dot"></span>
    <span id="auth-text">Checking&#8230;</span>
    <a id="auth-link" href="/auth/login" class="hidden">Sign in</a>
  </div>
</header>

<main>

  <!-- Step 1: Local folder -->
  <div class="card" id="step-1">
    <div class="card-title"><span class="step-label">1</span>Local Folder</div>
    <div class="row">
      <input type="text" id="folder-path" placeholder="/path/to/your/folder" />
      <button class="primary" id="btn-load-files">Load Files</button>
    </div>

    <div id="file-table-section" class="hidden mt14">
      <div class="sel-row">
        <input type="checkbox" id="select-all" title="Select / deselect all" />
        <label for="select-all">Select all</label>
        <a id="lnk-select-all">All</a>
        <a id="lnk-deselect-all">None</a>
        <span id="file-count-badge" class="badge">0 selected</span>
      </div>
      <div class="table-wrap">
        <table id="file-table">
          <thead>
            <tr>
              <th class="check-col"></th>
              <th class="sortable" data-col="name">Name <span class="sort-arrow" id="arrow-name">&#8597;</span></th>
              <th class="sortable" data-col="size">Size <span class="sort-arrow" id="arrow-size">&#8597;</span></th>
              <th class="sortable" data-col="mime">Type <span class="sort-arrow" id="arrow-mime">&#8597;</span></th>
              <th class="sortable" data-col="created">Created <span class="sort-arrow" id="arrow-created">&#8597;</span></th>
              <th class="sortable" data-col="modified">Modified <span class="sort-arrow" id="arrow-modified">&#8597;</span></th>
            </tr>
          </thead>
          <tbody id="file-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Step 2: Drive destination -->
  <div class="card hidden" id="step-2">
    <div class="card-title"><span class="step-label">2</span>Drive Destination</div>
    <button class="secondary" id="btn-load-folders">Load Drive Folders</button>
    <div id="folder-list"></div>
    <div id="selected-folder-info" class="text-muted mt8 hidden">
      Selected: <strong id="selected-folder-name"></strong>
    </div>
  </div>

  <!-- Step 3: Options + start -->
  <div class="card hidden" id="step-3">
    <div class="card-title"><span class="step-label">3</span>Upload Options</div>
    <div class="slider-row">
      <label for="delay-slider">Delay between uploads:</label>
      <input type="range" id="delay-slider" min="100" max="2000" step="50" value="500" />
      <span id="delay-val">500 ms</span>
    </div>
    <div class="mt14">
      <button class="primary" id="btn-start-upload">Start Upload</button>
    </div>
  </div>

  <!-- Step 4: Progress -->
  <div class="card hidden" id="step-4">
    <div class="card-title"><span class="step-label">4</span>Progress</div>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div id="progress-info">Waiting&#8230;</div>
    <div id="current-file"></div>
  </div>

  <!-- Step 5: Report -->
  <div class="card hidden" id="step-5">
    <div class="card-title"><span class="step-label">5</span>Upload Report</div>
    <div class="table-wrap">
      <table id="report-table">
        <thead>
          <tr>
            <th>Filename</th>
            <th>Size</th>
            <th>Local MD5</th>
            <th>Drive MD5</th>
            <th>Status</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody id="report-tbody"></tbody>
      </table>
    </div>
    <div class="export-row">
      <button class="secondary" id="btn-export-csv">Export CSV</button>
      <button class="secondary" id="btn-export-json">Export JSON</button>
    </div>
  </div>

</main>

<script>
"use strict";

/* -------------------------------------------------------------------------
   Application state
   ---------------------------------------------------------------------- */
const state = {
  authenticated: false,
  allFiles:      [],
  selectedPaths: new Set(),
  sortCol: "name",
  sortDir: "asc",
  selectedFolderId:   null,
  selectedFolderName: null,
  currentJobId: null,
  reportData:   [],
};

/* -------------------------------------------------------------------------
   DOM helpers
   ---------------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove("hidden");
const hide = id => $(id).classList.add("hidden");

function escHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatSize(bytes) {
  if (bytes == null) return "—";
  const units = ["B","KB","MB","GB","TB"];
  let i = 0, v = bytes;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(i === 0 ? 0 : 1) + " " + units[i];
}

function formatDate(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString();
}

/* Smart name sort key: extracts leading YYYY-MM-DD or YYYYMMDD */
function smartNameKey(name) {
  let m = name.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return "0_" + m[1] + m[2] + m[3] + "_" + name.toLowerCase();
  m = name.match(/^(\d{8})/);
  if (m) return "0_" + m[1] + "_" + name.toLowerCase();
  return "1_" + name.toLowerCase();
}

function sortKeyFor(file, col) {
  switch (col) {
    case "size":     return file.size || 0;
    case "created":  return file.created || "";
    case "modified": return file.modified || "";
    case "mime":     return (file.mime || "").toLowerCase();
    default:         return smartNameKey(file.name || "");
  }
}

/* -------------------------------------------------------------------------
   Auth
   ---------------------------------------------------------------------- */
async function checkAuth() {
  try {
    const r = await fetch("/auth/status");
    const j = await r.json();
    state.authenticated = j.authenticated;
    const badge = $("auth-badge");
    if (j.authenticated) {
      badge.classList.add("ok");
      $("auth-text").textContent = "Authenticated";
      hide("auth-link");
    } else {
      badge.classList.remove("ok");
      $("auth-text").textContent = "Not signed in —";
      show("auth-link");
    }
  } catch (_) {
    $("auth-text").textContent = "Error";
  }
}

/* -------------------------------------------------------------------------
   Step 1: Load local files
   ---------------------------------------------------------------------- */
async function loadFiles() {
  const path = $("folder-path").value.trim();
  if (!path) { alert("Please enter a folder path."); return; }

  $("btn-load-files").disabled = true;
  $("btn-load-files").textContent = "Loading…";

  try {
    const r = await fetch("/files/list", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path, sort_by: state.sortCol, sort_dir: state.sortDir }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail || r.statusText);
    }
    const j = await r.json();
    state.allFiles = j.files || [];
    state.selectedPaths = new Set(state.allFiles.map(f => f.path));
    renderFileTable();
    show("file-table-section");
    show("step-2");
  } catch (err) {
    alert("Error loading files: " + err.message);
  } finally {
    $("btn-load-files").disabled = false;
    $("btn-load-files").textContent = "Load Files";
  }
}

function renderFileTable() {
  const sorted = [...state.allFiles].sort((a, b) => {
    const ka = sortKeyFor(a, state.sortCol);
    const kb = sortKeyFor(b, state.sortCol);
    const cmp = ka < kb ? -1 : ka > kb ? 1 : 0;
    return state.sortDir === "asc" ? cmp : -cmp;
  });

  const tbody = $("file-tbody");
  tbody.innerHTML = "";

  for (const f of sorted) {
    const checked = state.selectedPaths.has(f.path);
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td class='check-col'>" +
        "<input type='checkbox' data-path='" + escHtml(f.path) + "' " + (checked ? "checked" : "") + " />" +
      "</td>" +
      "<td>" + escHtml(f.name) + "</td>" +
      "<td class='nowrap'>" + formatSize(f.size) + "</td>" +
      "<td class='text-muted'>" + escHtml(f.mime || "—") + "</td>" +
      "<td class='nowrap text-muted'>" + formatDate(f.created) + "</td>" +
      "<td class='nowrap text-muted'>" + formatDate(f.modified) + "</td>";
    tbody.appendChild(tr);
  }

  tbody.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      if (cb.checked) state.selectedPaths.add(cb.dataset.path);
      else state.selectedPaths.delete(cb.dataset.path);
      updateSelectionBadge();
      syncSelectAllCheckbox();
    });
  });

  updateSortArrows();
  updateSelectionBadge();
  syncSelectAllCheckbox();
}

function updateSelectionBadge() {
  $("file-count-badge").textContent = state.selectedPaths.size + " selected";
}

function syncSelectAllCheckbox() {
  const cb = $("select-all");
  cb.checked = state.selectedPaths.size > 0 && state.selectedPaths.size === state.allFiles.length;
  cb.indeterminate = state.selectedPaths.size > 0 && state.selectedPaths.size < state.allFiles.length;
}

function updateSortArrows() {
  ["name","size","mime","created","modified"].forEach(col => {
    const el = $("arrow-" + col);
    if (!el) return;
    if (col === state.sortCol) {
      el.textContent = state.sortDir === "asc" ? "↑" : "↓";
    } else {
      el.textContent = "↕";
    }
  });
}

document.querySelectorAll("th.sortable").forEach(th => {
  th.addEventListener("click", () => {
    if (state.sortCol === th.dataset.col) {
      state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    } else {
      state.sortCol = th.dataset.col;
      state.sortDir = "asc";
    }
    renderFileTable();
  });
});

$("select-all").addEventListener("change", e => {
  if (e.target.checked) state.selectedPaths = new Set(state.allFiles.map(f => f.path));
  else state.selectedPaths.clear();
  renderFileTable();
});

$("lnk-select-all").addEventListener("click", () => {
  state.selectedPaths = new Set(state.allFiles.map(f => f.path));
  renderFileTable();
});
$("lnk-deselect-all").addEventListener("click", () => {
  state.selectedPaths.clear();
  renderFileTable();
});

/* -------------------------------------------------------------------------
   Step 2: Drive folders
   ---------------------------------------------------------------------- */
async function loadDriveFolders(parentId) {
  parentId = parentId || "root";
  $("btn-load-folders").disabled = true;
  $("btn-load-folders").textContent = "Loading…";
  $("folder-list").innerHTML = "";

  try {
    const r = await fetch("/drive/folders?parent_id=" + encodeURIComponent(parentId));
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail || r.statusText);
    }
    const j = await r.json();
    renderFolderList(j.folders || [], parentId);
  } catch (err) {
    $("folder-list").innerHTML = "<p class='text-muted'>Error: " + escHtml(err.message) + "</p>";
  } finally {
    $("btn-load-folders").disabled = false;
    $("btn-load-folders").textContent = "Reload Folders";
  }
}

function renderFolderList(folders, parentId) {
  const list = $("folder-list");
  list.innerHTML = "";

  if (parentId !== "root") {
    const back = document.createElement("div");
    back.className = "folder-item";
    back.innerHTML = "<span class='folder-icon'>⬆️</span><span class='folder-name text-muted'>.. (back to root)</span>";
    back.addEventListener("click", () => loadDriveFolders("root"));
    list.appendChild(back);
  }

  const rootItem = document.createElement("div");
  rootItem.className = "folder-item" + (state.selectedFolderId === "root" ? " selected" : "");
  rootItem.innerHTML = "<span class='folder-icon'>🏠</span><span class='folder-name'>My Drive (root)</span>";
  rootItem.addEventListener("click", () => selectFolder("root", "My Drive (root)"));
  list.appendChild(rootItem);

  if (folders.length === 0) {
    const empty = document.createElement("p");
    empty.className = "text-muted mt8";
    empty.textContent = "No sub-folders found.";
    list.appendChild(empty);
    return;
  }

  for (const f of folders) {
    const item = document.createElement("div");
    item.className = "folder-item" + (state.selectedFolderId === f.id ? " selected" : "");
    item.dataset.folderId = f.id;
    item.innerHTML =
      "<span class='folder-icon'>📁</span>" +
      "<span class='folder-name'>" + escHtml(f.name) + "</span>" +
      "<span class='text-muted' style='margin-left:auto;font-size:.77rem'>▶ browse</span>";

    item.addEventListener("click", function(e) {
      const rect = item.getBoundingClientRect();
      if (e.clientX > rect.right - 70) {
        loadDriveFolders(f.id);
      } else {
        selectFolder(f.id, f.name);
      }
    });
    list.appendChild(item);
  }
}

function selectFolder(id, name) {
  state.selectedFolderId   = id;
  state.selectedFolderName = name;

  document.querySelectorAll("#folder-list .folder-item").forEach(el => {
    el.classList.remove("selected");
    if (el.dataset.folderId === id) el.classList.add("selected");
    if (id === "root") {
      const nm = el.querySelector(".folder-name");
      if (nm && nm.textContent === "My Drive (root)") el.classList.add("selected");
    }
  });

  $("selected-folder-name").textContent = name;
  show("selected-folder-info");
  show("step-3");
}

/* -------------------------------------------------------------------------
   Step 3: Delay slider
   ---------------------------------------------------------------------- */
$("delay-slider").addEventListener("input", function() {
  $("delay-val").textContent = this.value + " ms";
});

/* -------------------------------------------------------------------------
   Step 4: Upload
   ---------------------------------------------------------------------- */
async function startUpload() {
  if (state.selectedPaths.size === 0) { alert("No files selected."); return; }
  if (!state.selectedFolderId) { alert("No destination folder selected."); return; }

  const files = state.allFiles
    .filter(f => state.selectedPaths.has(f.path))
    .map(f => ({ path: f.path, name: f.name, size: f.size }));

  $("btn-start-upload").disabled = true;
  show("step-4");
  $("progress-bar").style.width = "0%";
  $("progress-info").textContent = "0 / " + files.length + " files";
  $("current-file").textContent = "Starting…";

  let jobId;
  try {
    const r = await fetch("/upload/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        files: files,
        destination_folder_id: state.selectedFolderId,
        delay_ms: parseInt($("delay-slider").value, 10),
      }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail || r.statusText);
    }
    const j = await r.json();
    jobId = j.job_id;
    state.currentJobId = jobId;
    state.reportData = [];
  } catch (err) {
    alert("Upload failed to start: " + err.message);
    $("btn-start-upload").disabled = false;
    return;
  }

  openSSE(jobId, files.length);
}

function openSSE(jobId, total) {
  const es = new EventSource("/upload/progress/" + jobId);

  es.addEventListener("progress", function(e) {
    const data = JSON.parse(e.data);
    const pct = Math.round((data.index / total) * 100);
    $("progress-bar").style.width = pct + "%";
    $("progress-info").textContent = data.index + " / " + total + " files";
    $("current-file").textContent = escHtml(data.file) + " — " + data.status;
    state.reportData.push(data);
    appendReportRow(data);
    show("step-5");
  });

  es.addEventListener("done", function() {
    es.close();
    $("progress-bar").style.width = "100%";
    $("progress-info").textContent = "Done — " + total + " files processed.";
    $("current-file").textContent = "";
    $("btn-start-upload").disabled = false;
  });

  es.addEventListener("error", function() {
    es.close();
  });
}

/* -------------------------------------------------------------------------
   Step 5: Report
   ---------------------------------------------------------------------- */
function statusChip(status) {
  const map = {
    uploaded: ["chip-uploaded", "✅ uploaded"],
    skipped:  ["chip-skipped",  "⏭ skipped"],
    error:    ["chip-error",    "❌ error"],
  };
  const pair = map[status] || ["", status];
  return "<span class='status-chip " + pair[0] + "'>" + escHtml(pair[1]) + "</span>";
}

function appendReportRow(data) {
  const tr = document.createElement("tr");
  const lm = data.local_md5
    ? "<span title='" + escHtml(data.local_md5) + "'>" + data.local_md5.slice(0,8) + "…</span>"
    : "—";
  const dm = data.drive_md5
    ? "<span title='" + escHtml(data.drive_md5) + "'>" + data.drive_md5.slice(0,8) + "…</span>"
    : "—";
  tr.innerHTML =
    "<td>" + escHtml(data.file || "") + "</td>" +
    "<td class='nowrap'>" + formatSize(data.size) + "</td>" +
    "<td style='font-family:monospace;font-size:.82rem'>" + lm + "</td>" +
    "<td style='font-family:monospace;font-size:.82rem'>" + dm + "</td>" +
    "<td>" + statusChip(data.status) + "</td>" +
    "<td class='nowrap text-muted'>" + (data.timestamp ? formatDate(data.timestamp) : "—") + "</td>";
  $("report-tbody").appendChild(tr);
}

$("btn-export-csv").addEventListener("click", function() {
  if (!state.currentJobId) return;
  const a = document.createElement("a");
  a.href = "/upload/report/" + state.currentJobId + "/csv";
  a.download = "";
  document.body.appendChild(a);
  a.click();
  a.remove();
});

$("btn-export-json").addEventListener("click", function() {
  const blob = new Blob([JSON.stringify(state.reportData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "gdrive-report-" + Date.now() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

/* -------------------------------------------------------------------------
   Wire buttons and initialise
   ---------------------------------------------------------------------- */
$("btn-load-files").addEventListener("click", loadFiles);
$("folder-path").addEventListener("keydown", function(e) { if (e.key === "Enter") loadFiles(); });
$("btn-load-folders").addEventListener("click", function() { loadDriveFolders("root"); });
$("btn-start-upload").addEventListener("click", startUpload);

(async function() {
  await checkAuth();
  const params = new URLSearchParams(window.location.search);
  if (params.get("auth") === "success") {
    window.history.replaceState({}, "", "/");
  }
})();
</script>
